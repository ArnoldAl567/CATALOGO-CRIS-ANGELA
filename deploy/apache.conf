<VirtualHost *:80>
    DocumentRoot /var/www/tienda/public
    DirectoryIndex index.html index.php

    <Directory /var/www/tienda/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
