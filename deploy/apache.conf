<VirtualHost *:80>
    DocumentRoot /var/www/tienda/public
    DirectoryIndex index.html index.php

    <Directory /var/www/tienda/public>
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo Options
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
