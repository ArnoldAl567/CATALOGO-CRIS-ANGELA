<VirtualHost *:80>
    DocumentRoot /var/www/tienda/public
    DirectoryIndex index.html index.php

    <Directory /var/www/tienda/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php

        <FilesMatch "^(main|styles)-[A-Z0-9]+\.(js|css)$">
            Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 304"
        </FilesMatch>

        <Files "index.html">
            Header set Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=60" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 304"
        </Files>
    </Directory>

    <Directory /var/www/tienda/public/assets>
        Header set Cache-Control "public, max-age=86400, s-maxage=86400" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 304"
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
